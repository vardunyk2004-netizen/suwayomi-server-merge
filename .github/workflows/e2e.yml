name: Fork E2E

on:
  push:
    branches: ['fork/**']
    paths: ['e2e/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  h2-tests:
    name: Fork application tests and H2 build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # This Android stub branch was republished with different classes; pin the
      # immutable revision already validated by the server Fork CI workflow.
      - name: Pin Android stub artifact revision
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          moving = 'maven("https://github.com/Suwayomi/Suwayomi-Server/raw/android-jar/")'
          pinned = 'maven("https://github.com/Suwayomi/Suwayomi-Server/raw/3983289d9481a8ba99c0b16350b27f41364906a2/")'
          if text.count(moving) != 1:
              raise SystemExit("Expected exactly one moving android-jar repository declaration")
          path.write_text(text.replace(moving, pinned), encoding="utf-8")
          PY

      - name: Copy CI Gradle properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Run lint, build, and server tests on H2
        run: ./gradlew ktlintCheck :server:shadowJar test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-e2e-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: fork-e2e-server-jar
          path: server/build/*.jar
          if-no-files-found: error
          retention-days: 3

      - name: H2 summary
        if: always()
        run: |
          echo "### Fork E2E: H2 application tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Job status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The current server test suite uses seeded application fixtures and fake sources where covered by its tests." >> "$GITHUB_STEP_SUMMARY"

  postgres-smoke:
    name: PostgreSQL migration/start smoke
    needs: h2-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu

      - name: Download exact-SHA server jar
        uses: actions/download-artifact@v4
        with:
          name: fork-e2e-server-jar
          path: jar

      - name: Start on a fresh PostgreSQL database
        run: |
          mkdir -p postgres-data
          JAR=$(ls jar/*.jar | head -1)
          set +e
          timeout 45s java -Xmx1g \
            -Dsuwayomi.tachidesk.config.server.rootDir="$PWD/postgres-data" \
            -Dsuwayomi.tachidesk.config.server.systemTrayEnabled=false \
            -Dsuwayomi.tachidesk.config.server.initialOpenInBrowserEnabled=false \
            -Dsuwayomi.tachidesk.config.server.databaseType=POSTGRESQL \
            -Dsuwayomi.tachidesk.config.server.databaseUrl=postgresql://localhost:5432/postgres \
            -Dsuwayomi.tachidesk.config.server.databaseUsername=postgres \
            -Dsuwayomi.tachidesk.config.server.databasePassword=postgres \
            -jar "$JAR" 2>&1 | tee postgres-smoke.log
          ecode="${PIPESTATUS[0]}"
          if [ "$ecode" -ne 124 ] && [ "$ecode" -ne 125 ]; then
            printf "PostgreSQL smoke: exit code '%s'\n" "$ecode"
            exit "$ecode"
          fi

      - name: Upload PostgreSQL startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-e2e-postgres-log
          path: postgres-smoke.log
          if-no-files-found: ignore
          retention-days: 3

      - name: PostgreSQL scope summary
        if: always()
        run: |
          echo "### Fork E2E: PostgreSQL startup" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Job status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This job verifies startup and migrations against a fresh PostgreSQL database; it does not seed operation fixtures or prove the baseline-upgrade matrix." >> "$GITHUB_STEP_SUMMARY"
